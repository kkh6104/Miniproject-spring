spring.application.name=mini_spring

# mybatis setting
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=C##MINIPROJECT
spring.datasource.password=MINI

# mapper 파일 경로 지정 (resources/mappers 하위의 모든 xml)
mybatis.mapper-locations=classpath:mappers/**/*.xml

# xml에서 패키지 경로 없이 클래스명만 입력할 수 있게 별칭 등록
mybatis.type-aliases-package=com.minip.Ddingflix.model.dto

mybatis.configuration.map-underscore-to-camel-case=true


spring.mvc.view.prefix=/WEB-INF/JSP/
spring.mvc.view.suffix=.jsp


